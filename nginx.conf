# 结构化 timing 日志，便于排查接口慢/502/超时（conf.d 在 http 块内 include）
log_format order_timing_json escape=json '{'
    '"time":"$time_iso8601",'
    '"request_id":"$request_id",'
    '"remote_addr":"$remote_addr",'
    '"xff":"$http_x_forwarded_for",'
    '"host":"$host",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time",'
    '"upstream_connect_time":"$upstream_connect_time",'
    '"upstream_header_time":"$upstream_header_time",'
    '"bytes_sent":$bytes_sent,'
    '"request_length":$request_length,'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent"'
'}';

server {
    listen ${FRONTEND_PORT};
    listen [::]:${FRONTEND_PORT};
    server_name _;

    client_max_body_size 1G;

    root ${FRONTEND_WEB_ROOT};
    index index.html index.htm;

    access_log /opt/front/log/access.log;
    access_log /opt/front/log/order_access_timing.log order_timing_json;
    error_log /opt/front/log/error.log;

    add_header X-Request-ID $request_id always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /stage-api/ {
        proxy_pass http://${HOST_IP}:${BACKEND_PORT}/;

        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }

    location ~ /\.ht {
        deny all;
    }
}
